<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="shortcut icon" href="Assets/9584825.png">
  <link rel="stylesheet" href="Css/Style.css">
</head>
<body>

  <button id="Home" onclick="location.href='Index.html'">Voltar</button>

  <div class="slider">
    <!-- radio buttons -->
    <input type="radio" name="radio-btn" id="radio1" checked>
    <input type="radio" name="radio-btn" id="radio2">
    <input type="radio" name="radio-btn" id="radio3">
    <input type="radio" name="radio-btn" id="radio4">

      <div class="slide-container">
        <div class="slide">
          <img src="Assets/1.png" alt="imagem 1"/>
        </div>
        <div class="slide">
          <img src="Assets/2.png" alt="imagem 2"/>
        </div>
        <div class="slide">
          <img src="Assets/3.png" alt="imagem 3"/>
        </div>
        <div class="slide">
          <img src="Assets/4.png" alt="imagem 4"/>
        </div>
      </div>
      <div id="txt">Minhas Memórias </br>Preferidas 🌹</div>
    </div>

    <!-- botões -->
    <div class="manual-navigation">
      <label for="radio1" class="manual-btn"></label>
      <label for="radio2" class="manual-btn"></label>
      <label for="radio3" class="manual-btn"></label>
      <label for="radio4" class="manual-btn"></label>
    </div>


  <footer>
    <iframe id="music" src="https://open.spotify.com/embed/track/6O6qYUHbLjT0kGHm5rfp95?utm_source=generator"></iframe>
  </footer>

  <script src="Js/javascript.js"></script>
</body>
</html>
